name: cadence
description: "Carnet d'enchaînements de sports de combat, avec révision espacée guidée par la voix."
publish_to: 'none'

# 1.0.0 is what the user reads; +1 is the Android versionCode, which must grow
# with every published APK.
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  freezed_annotation: ^3.1.0
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^4.0.3
  build_runner: ^2.17.1
  drift_dev: ^2.35.3

flutter:
  uses-material-design: true
  # D2: one optional image per technique, named after its slug (jab.png).
  # A missing image is replaced by the family badge.
  assets:
    - assets/techniques/
