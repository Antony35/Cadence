name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# The checks only read the repository.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by commit: a tag can be moved after the fact.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Same Flutter version as on the development machine, so the CI and the
      # local checks cannot disagree.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - run: flutter pub get
      # Checked before generation: the generated files are not ours to format.
      - run: dart format --output=none --set-exit-if-changed lib test
      # The *.freezed.dart and *.g.dart files are not versioned: rebuilt here.
      - run: dart run build_runner build
      - run: flutter analyze
      - run: flutter test
