name: cadence
description: "Carnet d'enchaînements de sports de combat, avec révision espacée guidée par la voix."
publish_to: 'none'

# 1.0.0 is what the user reads; +1 is the Android versionCode, which must grow
# with every published APK.
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  freezed_annotation: ^3.1.0
  intl: ^0.20.3
  just_audio: ^0.10.6
  package_info_plus: ^10.2.2
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  wakelock_plus: ^1.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^4.0.3
  build_runner: ^2.17.1
  drift_dev: ^2.35.3
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  # D2: one optional image per technique, named after its slug (jab.png).
  # A missing image is replaced by the family badge.
  assets:
    - assets/techniques/
    # The logo: the poster and its gloves, square.
    - assets/brand/
    - assets/fonts/OFL.txt
    # The voice: one recorded call per sentence, long (slow) and short.
    - assets/voice/full/
    - assets/voice/short/
  # Barlow (text) and Barlow Condensed (titles, figures, labels), bundled
  # because the app works offline. SIL Open Font License: assets/fonts/OFL.txt.
  fonts:
    - family: Barlow
      fonts:
        - asset: assets/fonts/Barlow-Regular.ttf
        - asset: assets/fonts/Barlow-Medium.ttf
          weight: 500
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
