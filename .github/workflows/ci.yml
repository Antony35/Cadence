name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same Flutter version as on the development machine, so the CI and the
      # local checks cannot disagree.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - run: flutter pub get
      # Checked before generation: the generated files are not ours to format.
      - run: dart format --output=none --set-exit-if-changed lib test
      # The *.freezed.dart and *.g.dart files are not versioned: rebuilt here.
      - run: dart run build_runner build
      - run: flutter analyze
      - run: flutter test
